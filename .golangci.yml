# https://golangci-lint.run — strict compliance config.
version: "2"

run:
  timeout: 5m

linters:
  # Standard set (govet, errcheck, ineffassign, staticcheck, unused) plus a
  # strict selection covering complexity, duplication, formatting, imports,
  # context usage, and ordering.
  default: standard
  enable:
    - wsl_v5      # whitespace / cuddling rules
    - unparam     # unused function params/results
    - noctx       # http calls / exec without context
    - testifylint # testify usage correctness
    - gocyclo     # cyclomatic complexity
    - goconst     # repeated strings that should be constants
    - depguard    # import allow/deny policy
    - dogsled     # too many blank identifiers in assignments
    - dupl        # duplicated code blocks
    - lll         # long lines
    - funlen      # long functions
    - funcorder   # declaration ordering (constructors, exported first)
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: deprecated; use io and os
            - pkg: github.com/pkg/errors
              desc: use the standard errors package with %w
    errcheck:
      # Best-effort writes to stderr / an io.Writer and Close on read paths are
      # intentionally unchecked.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
    staticcheck:
      # SA1019: gitleaks v8's detect.Fragment is flagged deprecated ("v9 will use
      # sources.Fragment") but is the current, correct API for v8.
      checks: ["all", "-SA1019"]
    lll:
      line-length: 120
    funlen:
      # Enforced, but generous enough not to fragment cohesive parsers/handlers.
      lines: 80
      statements: 60
    goconst:
      # gitc's command/flag vocabulary (git subcommand names, arch/flag tokens)
      # recurs across router map keys, the runMeta switch, and the cmdtree
      # display catalog as DATA, not magic constants — centralizing it across
      # packages would hurt readability without adding safety. Genuine duplicated
      # literals elsewhere are still flagged.
      ignore-string-values: '^(git|--all|--help|-h|--version|arm64|amd64|386|windows/amd64|windows/arm64|windows/386|init|scan|audit|scrub|where|install|uninstall|update|doctor|cmdtree|fetch-git|backend-update|version|help|auto|always|never|string|bool|passthrough|commit|push|pull|fetch|clone|remote|busybox|full|minimal)$'

  exclusions:
    rules:
      # Tests are legitimately long (table setups) and repeat literals/blocks.
      - path: _test\.go
        linters: [funlen, dupl, goconst, lll, noctx]

formatters:
  enable:
    - gofmt
