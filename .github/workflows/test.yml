name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.26.5"}
      - name: vet
        run: go vet ./...
      - name: test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.26.5"}
      # Run the exact golangci-lint version pinned in tools.go / go.mod so CI
      # matches local (the strict v2 .golangci.yml requires golangci-lint v2).
      - name: golangci-lint (pinned)
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint run ./...
