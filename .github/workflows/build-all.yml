name: build-all

# Cross-platform build/vet/test of gitc, plus a Windows smoke test of the
# `fetch-git` backend downloader (pulls the pinned MinGit, verifies its sha256,
# and unpacks it). Runs on main and on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitc:
    name: gitc ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  fetch-git-smoke:
    name: fetch-git smoke (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: build gitc
        run: go build -o gitc.exe .
      - name: fetch pinned MinGit (download + sha256 verify + unpack)
        run: ./gitc.exe gitc fetch-git
      - name: resolved backend is the downloaded git
        run: ./gitc.exe gitc where
